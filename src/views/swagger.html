<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Wild Oasis API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui.css" />
  <style>
    #auth-notice {
      font-size: 20px;
      margin-block: 10px;
      padding: 12px 16px;
      border: 1px solid #b8d5dc;
      border-radius: 4px;
      background: #eef6f8;
      color: #243746;
      text-align: center;
    }

    #access-message {
      font: 16px sans-serif;
      margin: 24px auto;
      max-width: 700px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="access-message" role="status"></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = async () => {
      const message = document.getElementById('access-message');
      const loadSwagger = () => {
        message.textContent = '';
        SwaggerUIBundle({
          url: window.location.origin + '/api-docs/openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'StandaloneLayout',
          onComplete: () => {
            document.getElementById('auth-notice').hidden = false;
          },
        });
      };

      try {
        const sessionResponse = await fetch('/api-docs/session', {
          cache: 'no-store',
        });

        if (sessionResponse.ok) {
          loadSwagger();
          return;
        }
        if (sessionResponse.status === 503) {
          message.textContent = 'API documentation access is not configured.';
          return;
        }
        if (sessionResponse.status !== 401) {
          message.textContent = 'Unable to check the documentation session.';
          return;
        }

        let key = window.prompt('Enter the API documentation key');
        if (key === null) {
          message.textContent =
            'Access cancelled. Reload this page to try again.';
          return;
        }

        const response = await fetch('/api-docs/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
          cache: 'no-store',
        });
        key = '';

        if (!response.ok) {
          message.textContent =
            response.status === 503
              ? 'API documentation access is not configured.'
              : 'Invalid key. Reload this page to try again.';
          return;
        }

        loadSwagger();
      } catch {
        message.textContent =
          'Unable to verify the documentation session. Reload this page to try again.';
      }
    };
  </script>
</body>

</html>
